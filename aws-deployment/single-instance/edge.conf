# ============================================================================
# edge.conf — the single entry point for the EC2 instance.
# ----------------------------------------------------------------------------
# Terminates TLS and routes by Host header to the two apps. Replaces what
# CloudFront + ALB + WAF would do in a multi-service AWS setup.
#
#   app.<domain>   -> user dashboard   (frontend :80, backend :5000)
#   admin.<domain> -> admin panel      (frontend :80, backend :5001)
#
# The per-app nginx containers keep serving their own static files — this one
# never touches disk except for the ACME challenge. That preserves the user
# frontend's ONNX/WASM MIME rules and each app's cache headers.
#
# NOTE: server_name values are literal — nginx does not expand environment
# variables in this file. If your domain is not smaartminds.com, edit them here.
# ============================================================================

worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Cap request bodies at the edge (defence in depth against memory DoS).
  # Must be >= the largest upload either app accepts.
  client_max_body_size 20m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

  # WAF-lite: per-IP rate limiting. The admin panel is publicly reachable, so
  # its login endpoint gets a much tighter bucket than general API traffic.
  limit_req_zone  $binary_remote_addr zone=api_rl:10m   rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=login_rl:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn_lim:10m;
  limit_req_status  429;
  limit_conn_status 429;

  # Docker's embedded DNS. Combined with the `set $upstream ...` variables
  # below, this lets nginx START even when an app container is still building,
  # and re-resolve names at request time instead of pinning an IP at boot.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server_tokens off;

  log_format edgelog '$remote_addr $host -> $upstream_addr [$status] $request_time s "$request"';
  access_log /var/log/nginx/access.log edgelog;

  # --- Shared proxy headers -------------------------------------------------
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ==========================================================================
  # Port 80: ACME challenge + redirect everything else to HTTPS
  # ==========================================================================
  server {
    listen 80;
    server_name app.smaartminds.com admin.smaartminds.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ==========================================================================
  # USER DASHBOARD — app.smaartminds.com
  # ==========================================================================
  server {
    listen 443 ssl;
    http2 on;
    server_name app.smaartminds.com;

    # One certificate covers both hostnames; it is filed under the first -d
    # name passed to certbot (see bootstrap.sh).
    ssl_certificate     /etc/letsencrypt/live/app.smaartminds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.smaartminds.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # camera=(self): the AI proctoring needs getUserMedia on this origin.
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=(self)" always;
    # Deliberately permissive so it cannot break the SPA. Tighten later with
    # nonces once the frontend is verified against a strict policy.
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; connect-src 'self' https: wss: ws:; frame-ancestors 'self';" always;

    # --- REST API -> user backend ------------------------------------------
    location /api/ {
      limit_req  zone=api_rl burst=40 nodelay;
      limit_conn conn_lim 100;
      set $ub user-backend;
      proxy_pass http://$ub:5000$request_uri;
      proxy_connect_timeout 5s;
      proxy_read_timeout    60s;
    }

    # --- Socket.IO ----------------------------------------------------------
    location /socket.io/ {
      set $ub_ws user-backend;
      proxy_pass http://$ub_ws:5000$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    # --- Raw WebSocket notifications channel --------------------------------
    location /ws/ {
      set $ub_wsn user-backend;
      proxy_pass http://$ub_wsn:5000$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    # --- User-uploaded media served by the backend --------------------------
    location /uploads/ {
      set $ub_up user-backend;
      proxy_pass http://$ub_up:5000$request_uri;
    }

    # --- Everything else -> the app's own nginx (SPA, ONNX, models) --------
    location / {
      set $uf user-frontend;
      proxy_pass http://$uf:80;
    }
  }

  # ==========================================================================
  # ADMIN PANEL — admin.smaartminds.com  (publicly reachable, per decision)
  # ==========================================================================
  server {
    listen 443 ssl;
    http2 on;
    server_name admin.smaartminds.com;

    ssl_certificate     /etc/letsencrypt/live/app.smaartminds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.smaartminds.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The admin panel has no reason to be framed by anyone, ever.
    add_header X-Frame-Options        "DENY"                            always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; connect-src 'self' https: wss: ws:; frame-ancestors 'none';" always;
    # Keep admin pages out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # --- Brute-force shield on the login endpoint ---------------------------
    # An internet-facing admin login needs a far tighter budget than the rest
    # of the API: 10 attempts/minute per IP, small burst, then 429.
    location /api/auth/login {
      limit_req  zone=login_rl burst=5 nodelay;
      limit_conn conn_lim 20;
      set $ab_login admin-backend;
      proxy_pass http://$ab_login:5001$request_uri;
      proxy_connect_timeout 5s;
      proxy_read_timeout    60s;
    }

    # --- REST API -> admin backend -----------------------------------------
    location /api/ {
      limit_req  zone=api_rl burst=40 nodelay;
      limit_conn conn_lim 100;
      set $ab admin-backend;
      proxy_pass http://$ab:5001$request_uri;
      proxy_connect_timeout 5s;
      proxy_read_timeout    60s;
    }

    # --- Admin-uploaded media (logos, profile photos, JDs) ------------------
    location /uploads/ {
      set $ab_up admin-backend;
      proxy_pass http://$ab_up:5001$request_uri;
    }

    # --- Everything else -> the admin app's own nginx (CRA SPA) ------------
    location / {
      set $af admin-frontend;
      proxy_pass http://$af:80;
    }
  }
}
