name: Deploy to EC2 (LEGACY - pm2/system-nginx - manual only)

# ============================================================================
# DISABLED on 2026-08-22. Was `on: push: branches: [main]`.
# ----------------------------------------------------------------------------
# This workflow targets the OLD, pre-Docker deployment: it copies the frontend
# build into /var/www/html, restarts the HOST's nginx via systemctl, and runs
# the backend under pm2.
#
# Production no longer works that way. Since 2026-08-22 the live site runs
# entirely in Docker on smaart-prod (13.207.12.89): nginx is the `edge`
# CONTAINER holding ports 80/443, and both backends are containers, not pm2
# processes. See aws-deployment/single-instance/README.md.
#
# If this ran against the live server it would `rm -rf /var/www/html/*`,
# fight the edge container for port 80 via `systemctl restart nginx`, and
# start a SECOND copy of the backend under pm2 alongside the container.
#
# Left in place as a record of the old deployment. To deploy now:
#   ssh in, git pull both repos, then from
#   aws-deployment/single-instance:  docker compose -f docker-compose.prod.yml up -d --build
# ============================================================================

on:
  workflow_dispatch:        # manual only — never auto-runs

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: front-end
        run: npm install

      - name: Build frontend
        working-directory: front-end
        run: npm run build

      - name: Deploy frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "front-end/dist/*"
          target: "/home/ubuntu/frontend-dist"
          strip_components: 2

      - name: Move frontend files into Nginx folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/html
            sudo rm -rf /var/www/html/*
            if [ -d "/home/ubuntu/frontend-dist" ] && [ "$(ls -A /home/ubuntu/frontend-dist)" ]; then
              sudo cp -r /home/ubuntu/frontend-dist/* /var/www/html/
            else
              echo "Warning: /home/ubuntu/frontend-dist is empty or missing"
            fi
            sudo systemctl restart nginx
            
  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: Deploy backend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_BACKEND_PATH }}
            git fetch origin main
            git reset --hard origin/main
            npm install --production
            pm2 restart smaart-userdashboard-backend || pm2 start server.js --name "smaart-userdashboard-backend"
