<svg class="arch" viewBox="0 0 1500 610" role="img" aria-label="Target setup: browsers resolve the Hostinger domain to one Elastic IP, pass the Security Group into Nginx, which serves the built front-ends and proxies /api to the two pm2-managed Express back-ends on ports 5000 and 5001, both talking to one shared MongoDB Atlas." xmlns="http://www.w3.org/2000/svg" width="1500" height="610"><style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');:root,svg{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#0F1B33; --muted:#5A6782; --line:#CBD3E3;
  --admin:#1A3884; --admin-tint:#E7ECF8; --student:#0B7A80; --student-tint:#DFF2F2;
  --db:#46557A; --db-tint:#ECEFF6; --hand:#B97A00; --hand-tint:#FFF5DC; --code:#23325A; --svc:#6B4FA3; --svc-tint:#F0EBFA;}
svg.arch, svg.road { color: var(--ink); font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
.mh { fill: var(--hand); } .mm { fill: var(--muted); }
.arrow line, .arrow polyline { stroke: currentColor; stroke-width: 1.3; }
.arrow text { font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
.arrow text.l { text-anchor: start; }
.arrow.hand line { stroke: var(--hand); stroke-width: 1.9; } .arrow.hand text { fill: var(--hand); font-weight: 600; }
.arrow.dash line, .arrow.dash polyline { stroke: var(--muted); stroke-dasharray: 5 4; }
.region rect { fill: var(--db-tint); fill-opacity: .5; stroke: var(--db); stroke-dasharray: 6 5; stroke-width: 1.3; }
.region text { font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: .06em; fill: var(--db); }
.fw rect { fill: var(--admin-tint); stroke: var(--admin); stroke-width: 1.3; }
.fw text { font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 10.5px; letter-spacing: .08em; fill: var(--admin); text-anchor: middle; }
.abox rect { fill: var(--surface); stroke-width: 1.5; stroke: var(--db); }
.abox .t { font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 13px; fill: var(--ink); }
.abox .s { font-size: 11px; fill: var(--muted); }
.abox .m { font-family: ui-monospace, Consolas, Menlo, monospace; font-size: 11px; fill: var(--code); }
.abox.student rect { stroke: var(--student); } .abox.student .t { fill: var(--student); }
.abox.admin rect { stroke: var(--admin); } .abox.admin .t { fill: var(--admin); }
.abox.nginx rect { stroke: var(--ink); stroke-width: 1.6; }
.abox.inner rect { fill: var(--bg); stroke-width: 1.2; }
.abox.inner.student rect { fill: var(--student-tint); } .abox.inner.admin rect { fill: var(--admin-tint); }
.abox.svc rect { stroke: var(--svc); fill: var(--svc-tint); } .abox.svc .t { fill: var(--svc); }
.abox.neutral rect { stroke: var(--muted); }
.phase rect { fill: var(--ink); } .phase text { font-family: Outfit, Inter, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .12em; fill: var(--bg); text-anchor: middle; }
.spine { stroke: var(--line); stroke-width: 2; }
.node circle { fill: var(--admin); stroke: var(--bg); stroke-width: 3; }
.node text { font-family: Outfit, Inter, sans-serif; font-weight: 700; font-size: 12px; fill: #FFFFFF; text-anchor: middle; }
.node.hand circle { fill: var(--hand); } .node.live circle { fill: var(--student); } .node.live path { stroke: #FFFFFF; stroke-width: 2.2; }
.card rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.card line.div { stroke: var(--line); stroke-width: 1; }
.card .t { font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 13.5px; fill: var(--admin); }
.card .s { font-size: 11px; fill: var(--ink); }
.card rect.code { fill: var(--db-tint); stroke: none; }
.card .m { font-family: ui-monospace, Consolas, Menlo, monospace; font-size: 11px; fill: var(--code); }
.card .dl { font-family: Outfit, Inter, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .12em; fill: var(--student); }
.card .d { font-size: 11px; fill: var(--ink); }
.callout rect { fill: var(--hand-tint); stroke: var(--hand); stroke-width: 1.6; }
.callout .t { font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 13.5px; fill: var(--hand); }
.callout .s { font-size: 11.5px; fill: var(--ink); }
.live rect { fill: var(--student-tint); stroke: var(--student); stroke-width: 1.6; }
.live text { font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 13px; fill: var(--student); text-anchor: middle; }
.after rect { fill: var(--surface); stroke: var(--student); stroke-width: 1.2; }
.after .t { font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 13px; fill: var(--student); }
.after .s, .skip .s { font-size: 11px; fill: var(--muted); }
.skip rect { fill: none; stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1; }
.skip .t { font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 13px; fill: var(--muted); }
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  <marker id="arrH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mh"/></marker>
  <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mm"/></marker>
</defs><g class="region"><rect x="550" y="60" width="590" height="460" rx="12"/><text x="596" y="86">AWS · one EC2 instance · Ubuntu 22.04 · t3.small · Elastic IP = &lt;EIP&gt;</text></g><g class="fw"><rect x="550" y="60" width="34" height="460" rx="12"/><text transform="translate(572 290) rotate(-90)">SECURITY GROUP · inbound only 22 (your IP) · 80 · 443 — 5000 / 5001 never public</text></g><g class="abox neutral"><rect x="300" y="60" width="220" height="92" rx="7"/><text class="t" x="312" y="80">Hostinger DNS</text><text class="m" x="312" y="98">A  @        →  &lt;EIP&gt;</text><text class="m" x="312" y="113">A  www   →  &lt;EIP&gt;</text><text class="m" x="312" y="128">A  admin  →  &lt;EIP&gt;</text></g><g class="abox student"><rect x="40" y="200" width="220" height="64" rx="7"/><text class="t" x="52" y="220">Students</text><text class="s" x="52" y="238">browser · Expo mobile app</text></g><g class="abox admin"><rect x="40" y="300" width="220" height="64" rx="7"/><text class="t" x="52" y="320">Staff &amp; recruiters</text><text class="s" x="52" y="338">browser</text></g><g class="abox neutral"><rect x="40" y="421" width="220" height="78" rx="7"/><text class="t" x="52" y="441">Your PC — Windows PowerShell</text><text class="s" x="52" y="459">ssh -i smaart.pem ubuntu@&lt;EIP&gt;</text><text class="s" x="52" y="474">only your IP may reach port 22</text></g><g class="abox nginx"><rect x="620" y="120" width="250" height="300" rx="7"/><text class="t" x="632" y="140">Nginx — the only public door</text><text class="s" x="632" y="158">:80 → redirects to :443</text><text class="s" x="632" y="173">Let’s Encrypt cert · auto-renews</text></g><g class="abox inner student"><rect x="632" y="182" width="226" height="110" rx="7"/><text class="t" x="644" y="202">yourdomain.com</text><text class="m" x="644" y="220">root  front-end/dist  (static)</text><text class="m" x="644" y="235">/api/         → 127.0.0.1:5000</text><text class="m" x="644" y="250">/socket.io/  → 127.0.0.1:5000</text></g><g class="abox inner admin"><rect x="632" y="306" width="226" height="96" rx="7"/><text class="t" x="644" y="326">admin.yourdomain.com</text><text class="m" x="644" y="344">root  Frontend/build  (static)</text><text class="m" x="644" y="359">/api/  → 127.0.0.1:5001</text></g><g class="abox nginx"><rect x="905" y="120" width="215" height="300" rx="7"/><text class="t" x="917" y="140">pm2 — keeps both alive</text><text class="s" x="917" y="158">restart on crash · pm2 save + startup</text><text class="s" x="917" y="173">= comes back after a reboot</text></g><g class="abox inner student"><rect x="917" y="196" width="191" height="82" rx="7"/><text class="t" x="929" y="216">user-backend</text><text class="m" x="929" y="234">Express  :5000</text><text class="m" x="929" y="249">back-end/.env  (chmod 600)</text></g><g class="abox inner admin"><rect x="917" y="313" width="191" height="82" rx="7"/><text class="t" x="929" y="333">admin-backend</text><text class="m" x="929" y="351">Express  :5001</text><text class="m" x="929" y="366">Backend/.env  (chmod 600)</text></g><g class="abox neutral"><rect x="620" y="440" width="160" height="44" rx="7"/><text class="t" x="632" y="460">sshd  :22</text><text class="m" x="632" y="478">user ubuntu</text></g><g class="abox neutral"><rect x="905" y="440" width="215" height="62" rx="7"/><text class="t" x="917" y="460">/var/www — both repos</text><text class="m" x="917" y="478">SMAART-INSTITUE-USERDASHBOARD</text><text class="m" x="917" y="493">ADMIN-SMAART-INSTITUTE-26</text></g><g class="abox neutral"><rect x="905" y="548" width="215" height="50" rx="7"/><text class="t" x="917" y="568">GitHub — both repos</text><text class="s" x="917" y="586">deploy keys · Actions deploy-ec2.yml</text></g><g class="abox svc"><rect x="1240" y="100" width="220" height="78" rx="7"/><text class="t" x="1252" y="120">MongoDB Atlas</text><text class="s" x="1252" y="138">ONE shared database</text><text class="s" x="1252" y="153">allow-list: &lt;EIP&gt; only, never 0.0.0.0/0</text></g><g class="abox svc"><rect x="1240" y="210" width="220" height="56" rx="7"/><text class="t" x="1252" y="230">Cloudinary</text><text class="s" x="1252" y="248">media uploads</text></g><g class="abox svc"><rect x="1240" y="300" width="220" height="56" rx="7"/><text class="t" x="1252" y="320">SMTP (mail app password)</text><text class="s" x="1252" y="338">OTP · welcome · login alerts</text></g><g class="abox svc"><rect x="1240" y="390" width="220" height="56" rx="7"/><text class="t" x="1252" y="410">OpenRouter · Deepgram</text><text class="s" x="1252" y="428">AI coach · speech — paid keys</text></g><g class="arrow "><line x1="260" y1="232" x2="618.5" y2="232" marker-end="url(#arr)"/><text x="440" y="214">https://yourdomain.com</text><text x="440" y="226">port 443 to &lt;EIP&gt;</text></g><g class="arrow "><line x1="260" y1="332" x2="618.5" y2="332" marker-end="url(#arr)"/><text x="440" y="314">https://admin.yourdomain.com</text><text x="440" y="326">port 443 to &lt;EIP&gt;</text></g><g class="arrow dash"><polyline points="150,200 150,106 298,106" fill="none" marker-end="url(#arrM)"/><text x="222" y="98">name → <EIP></text></g><g class="arrow "><line x1="260" y1="462" x2="618.5" y2="462" marker-end="url(#arr)"/><text x="440" y="444">ssh · port 22</text><text x="440" y="456">your IP only</text></g><g class="arrow "><line x1="858" y1="237" x2="915.5" y2="237" marker-end="url(#arr)"/><text x="887.5" y="231">:5000</text></g><g class="arrow "><line x1="858" y1="354" x2="915.5" y2="354" marker-end="url(#arr)"/><text x="887.5" y="348">:5001</text></g><g class="arrow "><line x1="1012" y1="548" x2="1012" y2="503.5" marker-end="url(#arr)"/><text class="l" x="1022" y="540">git clone / git pull</text></g><g class="arrow hand"><line x1="1120" y1="139" x2="1238.5" y2="139" marker-end="url(#arrH)"/><text x="1180" y="121">MONGODB_URI</text><text x="1180" y="133">same in both</text></g><g class="arrow "><line x1="1108" y1="238" x2="1238.5" y2="238" marker-end="url(#arr)"/><text x="1174" y="232">uploads</text></g><g class="arrow "><line x1="1108" y1="328" x2="1238.5" y2="328" marker-end="url(#arr)"/><text x="1174" y="322">mail</text></g><g class="arrow "><line x1="1108" y1="418" x2="1238.5" y2="418" marker-end="url(#arr)"/><text x="1174" y="412">API calls</text></g></svg>