<svg class="flow" viewBox="0 0 1500 1533" role="img" aria-label="Two portals, one database: what the admin side writes, the student side reads, row by row from institution setup to placement." xmlns="http://www.w3.org/2000/svg" width="1500" height="1533"><style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');:root,svg{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#0F1B33; --muted:#5A6782; --line:#CBD3E3;
  --admin:#1A3884; --admin-tint:#E7ECF8; --student:#0B7A80; --student-tint:#DFF2F2;
  --db:#46557A; --db-tint:#ECEFF6; --hand:#B97A00; --code:#23325A;}
svg.flow, svg.arch { color: var(--ink); font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
.lanebg { opacity: .55; }
.lanebg.admin { fill: var(--admin-tint); } .lanebg.student { fill: var(--student-tint); } .lanebg.db { fill: var(--db-tint); }
.lanehead rect { fill: var(--surface); stroke-width: 1.5; }
.lanehead.admin rect { stroke: var(--admin); } .lanehead.student rect { stroke: var(--student); } .lanehead.db rect { stroke: var(--db); stroke-dasharray: 5 4; }
.lanehead .lt { font-family: Outfit, Inter, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: .14em; text-anchor: middle; }
.lanehead.admin .lt { fill: var(--admin); } .lanehead.student .lt { fill: var(--student); } .lanehead.db .lt { fill: var(--db); }
.lanehead .ls { font-size: 11px; fill: var(--muted); text-anchor: middle; }
.row line { stroke: var(--line); stroke-width: 1; }
.row circle { fill: var(--ink); }
.row .rn { font-family: Outfit, Inter, sans-serif; font-weight: 700; font-size: 11px; fill: var(--bg); text-anchor: middle; }
.row .rt { font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; fill: var(--ink); }
.box rect { fill: var(--surface); stroke-width: 1.5; }
.box.admin rect { stroke: var(--admin); } .box.student rect { stroke: var(--student); }
.box .bt { font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 13px; fill: var(--ink); }
.box.admin .bt { fill: var(--admin); } .box.student .bt { fill: var(--student); }
.box .bs { font-size: 11px; fill: var(--muted); }
.box.ghost rect { fill: none; stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1; }
.box.ghost .bt { fill: var(--muted); font-weight: 500; }
.pill rect { fill: var(--db-tint); stroke: var(--db); stroke-width: 1.2; }
.pill text { font-family: ui-monospace, Consolas, 'SFMono-Regular', Menlo, monospace; font-size: 11.5px; font-weight: 500; fill: var(--code); text-anchor: middle; }
.arrow line { stroke: currentColor; stroke-width: 1.3; }
.arrow text { font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
.arrow.hand line { stroke: var(--hand); stroke-width: 1.9; }
.arrow.hand text { fill: var(--hand); font-weight: 600; }
.arrow.dash line { stroke: var(--muted); stroke-dasharray: 5 4; }
.mh { fill: var(--hand); } .mm { fill: var(--muted); }
.legend line.hand { stroke: var(--hand); stroke-width: 1.9; } .legend line.dash { stroke: var(--muted); stroke-dasharray: 5 4; stroke-width: 1.3; }
.legend text { font-size: 11px; fill: var(--muted); } .legend text.r { text-anchor: end; }
.node rect { fill: var(--surface); stroke-width: 1.5; }
.node.inst rect { stroke: var(--admin); } .node.earn rect { stroke: var(--student); fill: var(--student-tint); }
.node .nt { font-family: Outfit, Inter, sans-serif; font-weight: 600; font-size: 13px; text-anchor: middle; fill: var(--ink); }
.node.inst .nt { fill: var(--admin); } .node.earn .nt { fill: var(--student); }
.node .ns { font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
.chain { stroke: currentColor; stroke-width: 1.3; }
.legend2 rect.inst { fill: var(--surface); stroke: var(--admin); stroke-width: 1.5; }
.legend2 rect.earn { fill: var(--student-tint); stroke: var(--student); stroke-width: 1.5; }
.legend2 text { font-size: 11px; fill: var(--muted); }
</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
  <marker id="arrH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mh"/></marker>
  <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mm"/></marker>
</defs><rect class="lanebg admin" x="40" y="108" width="400" height="1385" rx="8"/><rect class="lanebg db" x="560" y="108" width="280" height="1385" rx="8"/><rect class="lanebg student" x="960" y="108" width="500" height="1385" rx="8"/><g class="lanehead admin"><rect x="40" y="28" width="400" height="66" rx="8"/><text class="lt" x="240" y="56">ADMIN PORTAL</text><text class="ls" x="240" y="76">ADMIN-SMAART-INSTITUTE-26 · admin, college admin, recruiter, support</text></g><g class="lanehead db"><rect x="560" y="28" width="280" height="66" rx="8"/><text class="lt" x="700" y="56">SHARED MONGODB</text><text class="ls" x="700" y="76">one database · models shared by both repos</text></g><g class="lanehead student"><rect x="960" y="28" width="500" height="66" rx="8"/><text class="lt" x="1210" y="56">STUDENT PORTAL</text><text class="ls" x="1210" y="76">SMAART-INSTITUE-USERDASHBOARD · web app + Expo mobile app</text></g><g class="row"><line x1="40" y1="124" x2="1460" y2="124"/><circle cx="53" cy="145" r="10"/><text class="rn" x="53" y="149">1</text><text class="rt" x="72" y="149">Set up the institution</text></g><g class="box admin "><rect x="40" y="170" width="400" height="68" rx="6"/><text class="bt" x="54" y="189">Onboard a College</text><text class="bs" x="54" y="208">tier decides what students can reach: Core · Standard · Complete</text><text class="bs" x="54" y="223">degrees, departments, batches, banners, institute chain</text></g><g class="box admin "><rect x="40" y="254" width="400" height="53" rx="6"/><text class="bt" x="54" y="273">Create the College Admin account</text><text class="bs" x="54" y="292">staff accounts wait for approval: pending → active</text></g><g class="pill"><rect x="652" y="191" width="96" height="26" rx="13"/><text x="700" y="208">colleges</text></g><g class="pill"><rect x="652" y="267.5" width="96" height="26" rx="13"/><text x="700" y="284.5">users</text></g><g class="arrow "><line x1="440" y1="204" x2="650.5" y2="204" marker-end="url(#arr)"/><text x="546" y="198">POST /api/colleges</text></g><g class="arrow "><line x1="440" y1="280.5" x2="650.5" y2="280.5" marker-end="url(#arr)"/><text x="546" y="274.5">creates</text></g><g class="box student ghost"><rect x="960" y="170" width="500" height="53" rx="6"/><text class="bt" x="974" y="189">No student access yet</text><text class="bs" x="974" y="208">there is nothing to log into until the college provisions accounts</text></g><g class="row"><line x1="40" y1="331" x2="1460" y2="331"/><circle cx="53" cy="352" r="10"/><text class="rn" x="53" y="356">2</text><text class="rt" x="72" y="356">Provision students</text></g><g class="box admin "><rect x="40" y="377" width="400" height="68" rx="6"/><text class="bt" x="54" y="396">Onboard students — one at a time or in bulk</text><text class="bs" x="54" y="415">temporary password sent in a welcome email</text><text class="bs" x="54" y="430">mustChangePassword: true · isRegistered: false · college set</text></g><g class="box student "><rect x="960" y="377" width="500" height="83" rx="6"/><text class="bt" x="974" y="396">First login — web or mobile app</text><text class="bs" x="974" y="415">choose institution → email + temp password → login OTP</text><text class="bs" x="974" y="430">forced password change → JWT · one active session per student</text><text class="bs" x="974" y="445">or self-signup with email OTP → lands as status: pending</text></g><g class="pill"><rect x="652" y="385" width="96" height="82" rx="13"/><text x="700" y="430">students</text></g><g class="arrow "><line x1="440" y1="399" x2="650.5" y2="399" marker-end="url(#arr)"/><text x="546" y="393">creates</text></g><g class="arrow hand"><line x1="748" y1="399" x2="958.5" y2="399" marker-end="url(#arrH)"/><text x="854" y="381">reads</text><text x="854" y="393">mustChangePassword</text></g><g class="arrow "><line x1="960" y1="429" x2="749.5" y2="429" marker-end="url(#arr)"/><text x="854" y="411">new password,</text><text x="854" y="423">flag cleared</text></g><g class="arrow dash"><line x1="960" y1="453" x2="749.5" y2="453" marker-end="url(#arrM)"/><text x="854" y="447">self-signup → pending</text></g><g class="row"><line x1="40" y1="491" x2="1460" y2="491"/><circle cx="53" cy="512" r="10"/><text class="rn" x="53" y="516">3</text><text class="rt" x="72" y="516">Onboarding — the Student DNA</text></g><g class="box student "><rect x="960" y="537" width="500" height="68" rx="6"/><text class="bt" x="974" y="556">Profile wizard on web · 4-step onboarding on mobile</text><text class="bs" x="974" y="575">personal · education · work · projects · certificates · preferences · goals</text><text class="bs" x="974" y="590">sets isRegistered: true — the dashboard stays locked until this is done</text></g><g class="box admin "><rect x="40" y="537" width="400" height="53" rx="6"/><text class="bt" x="54" y="556">College Admin watches the roster</text><text class="bs" x="54" y="575">student status, profile completeness, college analytics</text></g><g class="pill"><rect x="652" y="554" width="96" height="26" rx="13"/><text x="700" y="571">students</text></g><g class="arrow "><line x1="960" y1="567" x2="749.5" y2="567" marker-end="url(#arr)"/><text x="854" y="549">PATCH register-section</text><text x="854" y="561">POST register-details</text></g><g class="arrow "><line x1="652" y1="567" x2="441.5" y2="567" marker-end="url(#arr)"/><text x="546" y="561">reads</text></g><g class="row"><line x1="40" y1="629" x2="1460" y2="629"/><circle cx="53" cy="650" r="10"/><text class="rn" x="53" y="654">4</text><text class="rt" x="72" y="654">T1 Baseline assessment</text></g><g class="box admin "><rect x="40" y="675" width="400" height="53" rx="6"/><text class="bt" x="54" y="694">Author assessments and question banks</text><text class="bs" x="54" y="713">stage mix T1–T4, difficulty strata, proctoring rules</text></g><g class="box student "><rect x="960" y="675" width="500" height="83" rx="6"/><text class="bt" x="974" y="694">T1 Baseline — mandatory before the dashboard opens</text><text class="bs" x="974" y="713">6 quotients: CRQ · SRQ · LQ · SIQ · PEQ · DAQ</text><text class="bs" x="974" y="728">band: Emerging → Developing → Progressing → Strong → Advanced</text><text class="bs" x="974" y="743">result saved, report downloadable</text></g><g class="pill"><rect x="645.85" y="688" width="108.3" height="26" rx="13"/><text x="700" y="705">assessments</text></g><g class="pill"><rect x="652" y="728" width="96" height="26" rx="13"/><text x="700" y="745">results</text></g><g class="arrow "><line x1="440" y1="701" x2="644.35" y2="701" marker-end="url(#arr)"/><text x="542.925" y="695">authors</text></g><g class="arrow "><line x1="754.15" y1="701" x2="958.5" y2="701" marker-end="url(#arr)"/><text x="857.075" y="695">serves questions</text></g><g class="arrow "><line x1="960" y1="741" x2="749.5" y2="741" marker-end="url(#arr)"/><text x="854" y="723">auto-save, submit</text><text x="854" y="735">score + band</text></g><g class="row"><line x1="40" y1="782" x2="1460" y2="782"/><circle cx="53" cy="803" r="10"/><text class="rn" x="53" y="807">5</text><text class="rt" x="72" y="807">Learning journey</text></g><g class="box admin "><rect x="40" y="828" width="400" height="83" rx="6"/><text class="bt" x="54" y="847">Author the Human Intelligence Programme</text><text class="bs" x="54" y="866">25 courses S01–S25 in 3 stages:</text><text class="bs" x="54" y="881">Capacity → Capability → Leadership</text><text class="bs" x="54" y="896">daily steps: video · quiz · evidence · reflection · flashcards</text></g><g class="box student "><rect x="960" y="828" width="500" height="68" rx="6"/><text class="bt" x="974" y="847">Enroll and progress day by day</text><text class="bs" x="974" y="866">progression gated server-side — no skipping stages or days</text><text class="bs" x="974" y="881">completion → badges, XP, streaks, publicly verifiable certificate</text></g><g class="pill"><rect x="652" y="839" width="96" height="26" rx="13"/><text x="700" y="856">courses</text></g><g class="pill"><rect x="623.95" y="875" width="152.1" height="26" rx="13"/><text x="700" y="892">courseenrollments</text></g><g class="arrow "><line x1="440" y1="852" x2="650.5" y2="852" marker-end="url(#arr)"/><text x="546" y="846">publishes</text></g><g class="arrow "><line x1="748" y1="852" x2="958.5" y2="852" marker-end="url(#arr)"/><text x="854" y="846">reads</text></g><g class="arrow "><line x1="960" y1="888" x2="777.5500000000001" y2="888" marker-end="url(#arr)"/><text x="868.0250000000001" y="870">video / task / reflection</text><text x="868.0250000000001" y="882">progress writes</text></g><g class="row"><line x1="40" y1="935" x2="1460" y2="935"/><circle cx="53" cy="956" r="10"/><text class="rn" x="53" y="960">6</text><text class="rt" x="72" y="960">Tracks, T2–T4 and the Skills Passport</text></g><g class="box admin "><rect x="40" y="981" width="400" height="68" rx="6"/><text class="bt" x="54" y="1000">The college tier unlocks tracks</text><text class="bs" x="54" y="1019">Core: PIQ optional · Standard: PIQ + AIQ · Complete: all</text><text class="bs" x="54" y="1034">college analytics dashboards read the same results</text></g><g class="box student "><rect x="960" y="981" width="500" height="68" rx="6"/><text class="bt" x="974" y="1000">Tracks PIQ · AIQ · SQ and assessments T2–T4</text><text class="bs" x="974" y="1019">quotients roll up into the SRI score</text><text class="bs" x="974" y="1034">Skills Passport — shareable record of scores, skills, certificates</text></g><g class="pill"><rect x="652" y="992" width="96" height="26" rx="13"/><text x="700" y="1009">results</text></g><g class="pill"><rect x="631.25" y="1024" width="137.5" height="26" rx="13"/><text x="700" y="1041">skillspassports</text></g><g class="arrow "><line x1="960" y1="1005" x2="749.5" y2="1005" marker-end="url(#arr)"/><text x="854" y="999">T2–T4 submits</text></g><g class="arrow "><line x1="652" y1="1005" x2="441.5" y2="1005" marker-end="url(#arr)"/><text x="546" y="999">analytics</text></g><g class="arrow "><line x1="768.75" y1="1037" x2="958.5" y2="1037" marker-end="url(#arr)"/><text x="864.375" y="1031">issues passport</text></g><g class="row"><line x1="40" y1="1074" x2="1460" y2="1074"/><circle cx="53" cy="1095" r="10"/><text class="rn" x="53" y="1099">7</text><text class="rt" x="72" y="1099">Career and placement</text></g><g class="box admin "><rect x="40" y="1120" width="400" height="53" rx="6"/><text class="bt" x="54" y="1139">Create Recruiter accounts</text><text class="bs" x="54" y="1158">active immediately — no approval gate, password emailed</text></g><g class="box admin "><rect x="40" y="1188" width="400" height="68" rx="6"/><text class="bt" x="54" y="1207">Recruiter posts jobs with eligibility rules</text><text class="bs" x="54" y="1226">JobPosting (one college) or SmaartJobPosting (platform-wide)</text><text class="bs" x="54" y="1241">min CGPA, degree, skills, backlog, 10th / 12th filters</text></g><g class="box admin "><rect x="40" y="1272" width="400" height="68" rx="6"/><text class="bt" x="54" y="1291">Recruiter / College Admin runs the pipeline</text><text class="bs" x="54" y="1310">Applied → Under Review → Shortlisted →</text><text class="bs" x="54" y="1325">Interviewing → Selected / Offered → Placed</text></g><g class="box student "><rect x="960" y="1188" width="500" height="53" rx="6"/><text class="bt" x="974" y="1207">Jobs, job fairs, AI career coach, resume builder</text><text class="bs" x="974" y="1226">matching jobs surfaced by eligibility rules</text></g><g class="box student "><rect x="960" y="1272" width="500" height="68" rx="6"/><text class="bt" x="974" y="1291">Applying</text><text class="bs" x="974" y="1310">today staff enroll the student into a job — self-apply is not wired yet</text><text class="bs" x="974" y="1325">every status change arrives as email + in-app notification</text></g><g class="pill"><rect x="649.5" y="1133.5" width="101" height="26" rx="13"/><text x="700" y="1150.5">recruiters</text></g><g class="pill"><rect x="645.85" y="1209" width="108.3" height="26" rx="13"/><text x="700" y="1226">jobpostings</text></g><g class="pill"><rect x="609.35" y="1285" width="181.29999999999998" height="48" rx="13"/><text x="700" y="1313">placementapplications</text></g><g class="arrow "><line x1="440" y1="1146.5" x2="648" y2="1146.5" marker-end="url(#arr)"/><text x="544.75" y="1140.5">creates</text></g><g class="arrow "><line x1="440" y1="1222" x2="644.35" y2="1222" marker-end="url(#arr)"/><text x="542.925" y="1216">posts</text></g><g class="arrow "><line x1="754.15" y1="1222" x2="958.5" y2="1222" marker-end="url(#arr)"/><text x="857.075" y="1216">eligibility match</text></g><g class="arrow "><line x1="440" y1="1298" x2="607.85" y2="1298" marker-end="url(#arr)"/><text x="524.675" y="1292">enroll, move status</text></g><g class="arrow hand"><line x1="790.65" y1="1320" x2="958.5" y2="1320" marker-end="url(#arrH)"/><text x="875.325" y="1302">email + in-app</text><text x="875.325" y="1314">notification</text></g><g class="row"><line x1="40" y1="1364" x2="1460" y2="1364"/><circle cx="53" cy="1385" r="10"/><text class="rn" x="53" y="1389">8</text><text class="rt" x="72" y="1389">Support and community</text></g><g class="box student "><rect x="960" y="1410" width="500" height="53" rx="6"/><text class="bt" x="974" y="1429">Tickets · grievances · community hub · coach sessions</text><text class="bs" x="974" y="1448">raise, post, book — and get status back</text></g><g class="box admin "><rect x="40" y="1410" width="400" height="53" rx="6"/><text class="bt" x="54" y="1429">Support queue · grievance log · moderation · escalations</text><text class="bs" x="54" y="1448">IT support, College Admin, Admin, moderators</text></g><g class="pill"><rect x="583.8" y="1413" width="232.4" height="50" rx="13"/><text x="700" y="1442">tickets · grievances · posts</text></g><g class="arrow "><line x1="960" y1="1426" x2="817.6999999999999" y2="1426" marker-end="url(#arr)"/><text x="888.0999999999999" y="1420">raises / posts</text></g><g class="arrow "><line x1="816.1999999999999" y1="1450" x2="958.5" y2="1450" marker-end="url(#arr)"/><text x="888.0999999999999" y="1444">status, replies</text></g><g class="arrow "><line x1="583.8" y1="1426" x2="441.5" y2="1426" marker-end="url(#arr)"/><text x="511.9" y="1420">queue</text></g><g class="arrow "><line x1="440" y1="1450" x2="582.3" y2="1450" marker-end="url(#arr)"/><text x="511.9" y="1444">resolves, moderates</text></g><g class="legend">
  <line x1="60" y1="1507" x2="120" y2="1507" class="hand" marker-end="url(#arrH)"/><text x="130" y="1511">the hand-off that crosses from one portal to the other</text>
  <line x1="520" y1="1507" x2="580" y2="1507" class="dash" marker-end="url(#arrM)"/><text x="590" y="1511">optional path</text>
  <text x="1460" y="1511" class="r">rows are the order a student actually moves through the system</text>
</g></svg>