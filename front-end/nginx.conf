server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve upstream hostnames at REQUEST time, not at startup. Every
    # proxy_pass below goes through a `set $var host;` variable for that
    # reason: with a literal hostname nginx resolves it once while loading the
    # config and refuses to start at all when the name does not exist yet
    # ("host not found in upstream"). That is exactly what took production
    # down on deploy: the compose service there is `user-backend` and the
    # edge proxy answers /api itself, so `backend` never resolves inside this
    # container and nginx crash-looped -> 502 -> automatic rollback. Locally
    # (docker-compose.yml) the service IS called `backend`, so both stacks
    # must keep working from the same image. 127.0.0.11 is Docker's embedded
    # DNS, present in every compose network.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cross-origin isolation, for multi-threaded WASM in the proctoring models
    # (ort.env.wasm.numThreads only takes effect when self.crossOriginIsolated
    # is true). `credentialless` (not `require-corp`) so cross-origin
    # Cloudinary/Supabase images that don't send CORP headers still load.
    # NOTE: locations below that already call add_header must repeat these —
    # nginx does not inherit add_header from the server block once a location
    # defines its own.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    # Static assets get long-lived caching (Vite fingerprints filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        try_files $uri =404;
    }

    # AI proctoring runtime: .mjs must be served as JavaScript (module imports
    # reject other MIME types) and a missing file must 404 — never fall back to
    # index.html, which masks the real error behind a confusing fetch failure.
    location /onnx-wasm/ {
        types { application/javascript js mjs; application/wasm wasm; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        try_files $uri =404;
    }
    location /models/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        try_files $uri =404;
    }

    # Backend API — every relative /api/... fetch made by the SPA must reach
    # the backend here (local compose service `backend`; in production the
    # edge nginx routes /api straight to `user-backend` before it gets here,
    # and `user-backend` also carries a `backend` network alias so this block
    # still works if it is ever hit). Without this block, /api/ requests
    # fall through to the SPA catch-all below: a GET silently gets back
    # index.html's HTML (200, but not real JSON), and anything else (POST,
    # PUT, DELETE...) gets nginx's own 405, since static-file serving only
    # answers GET/HEAD. That's exactly what happens without this location.
    location /api/ {
        set $backend backend;
        proxy_pass http://$backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket channels the backend exposes (live notifications, sockets).
    location /socket.io/ {
        set $backend backend;
        proxy_pass http://$backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
    location /ws/ {
        set $backend backend;
        proxy_pass http://$backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Uploaded files served by the backend (resumes, certificates, etc.)
    location /uploads/ {
        set $backend backend;
        proxy_pass http://$backend:5000;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Employer self-registration is now a standalone page owned by THIS app
    # (EmployerRegister.jsx / POST /api/employer-registration) so it works
    # whether or not the separate admin project is running. An exact-match
    # location (`=`) always wins over the /employer/ prefix proxy below,
    # regardless of declaration order, so this must route to the SPA, not
    # the admin app, even though it lives under the same /employer/ prefix.
    location = /employer/register {
        try_files $uri $uri/ /index.html;
    }

    # Every OTHER employer page is still served by the admin app, but must
    # appear on this domain so employers never leave smaartinstitute.com.
    # Proxying keeps a single copy of that page owned by the admin project --
    # no duplicated component, no cross-origin call, no extra build-time
    # variable.
    location /employer/ {
        set $admin_frontend admin-frontend;
        proxy_pass http://$admin_frontend:80$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The admin app is a SPA too; let it answer its own deep links.
        proxy_intercept_errors off;
    }

    # The admin build's own assets, referenced by the proxied page.
    location /static/ {
        set $admin_frontend admin-frontend;
        proxy_pass http://$admin_frontend:80$request_uri;
        proxy_set_header Host $host;
    }

    # SPA fallback — every non-file route serves index.html so React Router
    # handles deep links like /dashboard/placement
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry point, so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }
}
