server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets get long-lived caching (Vite fingerprints filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # AI proctoring runtime: .mjs must be served as JavaScript (module imports
    # reject other MIME types) and a missing file must 404 — never fall back to
    # index.html, which masks the real error behind a confusing fetch failure.
    location /onnx-wasm/ {
        types { application/javascript js mjs; application/wasm wasm; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /models/ {
        try_files $uri =404;
    }

    # Employer registration is served by the admin app, but must appear on
    # this domain so employers never leave smaartinstitute.com. Proxying keeps
    # a single copy of that page owned by the admin project -- no duplicated
    # component, no cross-origin call, no extra build-time variable.
    location /employer/ {
        proxy_pass http://admin-frontend:80/employer/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The admin app is a SPA too; let it answer its own deep links.
        proxy_intercept_errors off;
    }

    # The admin build's own assets, referenced by the proxied page.
    location /static/ {
        proxy_pass http://admin-frontend:80/static/;
        proxy_set_header Host $host;
    }

    # SPA fallback — every non-file route serves index.html so React Router
    # handles deep links like /dashboard/placement
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry point, so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
