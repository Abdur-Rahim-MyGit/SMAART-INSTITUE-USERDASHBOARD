# ============================================================================
# nginx.conf  —  The edge layer for the production-SHAPED local stack.
# Plays the combined role of AWS CloudFront (CDN) + ALB (load balancer) +
# WAF (firewall) for local rehearsal. Real AWS uses the managed services;
# this mirrors their behaviour so we can test load balancing, rate limiting,
# and traffic locally and for free.
# ============================================================================
worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # --- Compression (CloudFront/ALB do this in prod) ------------------------
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

  # --- WAF-lite / firewall: per-IP rate limiting (AWS WAF role) ------------
  # 20 requests/sec per IP for the API, with a small burst. Excess → HTTP 429.
  limit_req_zone  $binary_remote_addr zone=api_rl:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn_lim:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Docker's embedded DNS — lets Nginx re-resolve the `backend` service name
  # at request time so it load-balances across ALL backend replicas (ECS tasks).
  resolver 127.0.0.11 valid=5s ipv6=off;

  # --- Security headers at the edge (defense in depth) ---------------------
  add_header X-Frame-Options        "SAMEORIGIN"                    always;
  add_header X-Content-Type-Options "nosniff"                       always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection       "1; mode=block"                 always;
  # Permissions-Policy: lock down browser features the app doesn't use.
  add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
  # Content-Security-Policy: deliberately PERMISSIVE so it cannot break the SPA
  # (allows inline/eval + https/data/blob). Tighten with frontend testing later
  # (replace 'unsafe-inline'/'unsafe-eval' with nonces/hashes).
  add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; connect-src 'self' https: wss: ws:; frame-ancestors 'self';" always;
  # NOTE: Cross-Origin-Embedder-Policy is intentionally NOT set — require-corp
  # would block Cloudinary/Supabase resources that don't send CORP headers.

  # Hide nginx version in error pages / Server header
  server_tokens off;

  log_format upstreamlog '$remote_addr -> $upstream_addr [$status] $request_time s "$request"';
  access_log /var/log/nginx/access.log upstreamlog;

  server {
    listen 80;
    server_name localhost;

    # Frontend static files (= S3 + CloudFront)
    root  /usr/share/nginx/html;
    index index.html;

    # --- API → backend replicas (= ALB → ECS tasks) ----------------------
    location /api/ {
      limit_req  zone=api_rl burst=40 nodelay;   # firewall: shed abusive bursts
      limit_conn conn_lim 100;

      set $backend_upstream backend;             # re-resolved per request → LB
      proxy_pass http://$backend_upstream:5000$request_uri;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout    60s;

      add_header X-Upstream $upstream_addr always; # PROVES which replica served
    }

    # --- WebSocket (= ALB WebSocket routing) ------------------------------
    location /socket.io/ {
      set $ws_upstream backend;
      proxy_pass http://$ws_upstream:5000$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;
      proxy_read_timeout 3600s;
    }

    # --- SPA fallback: any non-file route serves index.html ---------------
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
